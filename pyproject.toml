[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cfb-predictor"
version = "0.1.0"
description = "College football game and national-title predictor"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1", "numpy>=1.26", "pyarrow>=14", "scipy>=1.11", "scikit-learn>=1.4",
    "xgboost>=2.0", "lightgbm>=4.0", "joblib>=1.3", "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E501"]
